<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}job-radar{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: '#a78bfa', dim: '#7c5cd8' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script defer src="/static/js/markdown.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .htmx-show-on-request { display: none; }
    .htmx-request .htmx-show-on-request { display: inline; }
    .htmx-request .htmx-hide-on-request { display: none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <nav class="border-b border-gray-800 px-4 sm:px-8 py-3 flex items-center gap-6 text-sm">
    <a href="/" class="font-semibold text-gray-100">📡 job-radar</a>
    <a href="/" class="text-gray-400 hover:text-gray-100">Board</a>
    <a href="/classify" class="text-gray-400 hover:text-gray-100">Classify</a>
    <a href="/market" class="text-gray-400 hover:text-gray-100">Market</a>
    <a href="/skills" class="text-gray-400 hover:text-gray-100">Skills</a>
    <a href="/profile" class="text-gray-400 hover:text-gray-100">Profile</a>
  </nav>
  <main class="px-4 sm:px-8 py-6 max-w-7xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
