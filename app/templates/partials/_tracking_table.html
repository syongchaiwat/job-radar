{# Board table view, for tracking applications: one row per visible job, rendered client-side
   from jobs-data so sorting and logging a stage need no reload. Click a row to expand its timeline. #}
<div x-show="view === 'table'" x-cloak class="bg-gray-900/50 border border-gray-800 rounded-xl overflow-hidden">
  <div class="flex flex-wrap items-center gap-3 px-5 py-4 border-b border-gray-800">
    <h2 class="text-lg font-semibold" x-text="section === 'labs' ? 'Lab outreach' : 'Application tracking'">Application tracking</h2>
    <span class="label-mono text-xs bg-accent-dim/20 text-accent rounded-md px-2 py-0.5" x-text="visible.length + ' rows'"></span>
    <span class="label-mono text-xs text-gray-500 ml-auto" x-text="'Sort: ' + (section === 'labs' ? labSorts[labSort] : sorts[sort])"></span>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm min-w-[980px]">
      <thead>
        <tr class="text-left border-b border-gray-800 bg-gray-950/40">
          <th class="w-10 px-3 py-3"></th>
          <th class="px-3 py-3 text-xs uppercase tracking-wide font-medium text-gray-500" x-text="section === 'labs' ? 'Lab & topic' : 'Company & role'">Company &amp; role</th>
          <th class="px-3 py-3 text-xs uppercase tracking-wide font-medium text-gray-500">Stage</th>
          <th class="px-3 py-3 text-xs uppercase tracking-wide font-medium text-gray-500" x-text="section === 'labs' ? 'Sent' : 'Applied'">Applied</th>
          <th class="px-3 py-3 text-xs uppercase tracking-wide font-medium text-gray-500">Next</th>
          <th class="px-3 py-3 text-xs uppercase tracking-wide font-medium text-gray-500">Last activity</th>
          <th class="px-3 py-3 text-xs uppercase tracking-wide font-medium text-gray-500" x-text="section === 'labs' ? 'CV' : 'Sent'">Sent</th>
        </tr>
      </thead>
      <template x-for="j in sortedVisible" :key="j.job_id">
        <tbody class="border-b border-gray-800/70 last:border-0">
          <tr class="hover:bg-gray-800/30 align-top cursor-pointer"
              :class="[isSelected(j.job_id) ? 'bg-accent-dim/10' : '', (j.app.closed || j.status === 'skipped') ? 'opacity-60' : '', expanded === j.job_id ? 'bg-gray-800/30' : '']"
              @click="selecting ? cardClick($event, j.job_id) : toggleRow(j.job_id)">
            <td class="px-3 py-4">
              <button type="button" @click.stop="toggleBookmark(j.job_id)" :title="j.bookmarked ? 'Remove bookmark' : 'Bookmark'"
                      :class="j.bookmarked ? 'text-accent' : 'text-gray-700 hover:text-gray-400'">
                <svg width="14" height="18" viewBox="0 0 20 26" aria-hidden="true">
                  <path d="M1 0h18v25l-9-6.5L1 25z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" :fill="j.bookmarked ? 'currentColor' : 'none'"/>
                </svg>
              </button>
            </td>
            <td class="px-3 py-4">
              <div class="flex gap-3">
                <span class="shrink-0 w-10 h-10 rounded-md bg-gray-800 border border-gray-700 flex items-center justify-center font-display font-bold text-gray-300" x-text="initials(j.company)"></span>
                <div class="min-w-0">
                  <p class="label-mono text-[11px] uppercase text-gray-500 truncate">
                    <span class="text-gray-400" x-text="j.company"></span><span x-show="j.location" x-text="' • ' + j.location"></span>
                  </p>
                  <a :href="'/jobs/' + j.job_id" @click.stop="if (selecting) $event.preventDefault()" class="font-display font-semibold text-[15px] text-gray-100 hover:text-accent" x-text="j.title"></a>
                  <p x-show="j.kind === 'outreach' && j.contact" class="text-xs text-gray-400 mt-0.5" x-text="j.contact"></p>
                  <div x-show="j.kind !== 'outreach'" class="flex flex-wrap gap-1.5 mt-1.5 label-mono text-[11px]">
                    <span x-show="j.archetype_name" class="bg-gray-800 text-accent rounded px-1.5 py-0.5" x-text="j.archetype_name"></span>
                    <span x-show="j.lane_name" class="text-gray-400 px-1 py-0.5" x-text="j.lane_name"></span>
                  </div>
                </div>
              </div>
            </td>
            <td class="px-3 py-4 whitespace-nowrap">
              <button type="button" @click.stop="logStage(j)" title="Log a stage"
                      class="label-mono text-xs border rounded-md px-2 py-1 hover:brightness-125" :class="stageClass(j.status)" x-text="j.app.stage_label + ' ▾'"></button>
              <p x-show="j.app.stage_date" class="label-mono text-[11px] text-gray-500 mt-1.5" x-text="(j.app.stage_estimated ? '≈ ' : '') + fmtDay(j.app.stage_date) + ' · ' + relDay(j.app.stage_date)"></p>
              <div x-show="j.app.applied" class="flex items-center gap-1 mt-2 w-28" aria-label="Progress">
                <template x-for="(s, i) in j.app.stepper" :key="s.stage">
                  <span class="flex items-center gap-1" :class="i < j.app.stepper.length - 1 ? 'flex-1' : ''" :title="s.label + (s.date ? ' · ' + s.date : (s.passed ? ' · skipped' : ''))">
                    <span class="w-2 h-2 rounded-full shrink-0"
                          :class="(j.app.closed && j.status !== 'accepted' && i === j.app.stepper.filter(x => x.passed).length - 1) ? 'bg-red-400' : (s.done ? 'bg-green-400' : (s.passed ? 'border border-green-500/70' : 'bg-gray-700'))"></span>
                    <span x-show="i < j.app.stepper.length - 1" class="h-px flex-1" :class="j.app.stepper[i + 1] && j.app.stepper[i + 1].passed ? 'bg-green-500/60' : 'bg-gray-700'"></span>
                  </span>
                </template>
              </div>
            </td>
            <td class="px-3 py-4 label-mono text-xs tabular whitespace-nowrap">
              <template x-if="j.app.applied_date">
                <div>
                  <p class="text-gray-200" x-text="(j.app.applied_estimated ? '≈ ' : '') + fmtDay(j.app.applied_date)"></p>
                  <p class="text-gray-500" x-text="j.app.closed ? 'closed' : (j.status === 'applied' ? 'waiting ' : '') + (-daysBetween(j.app.applied_date)) + ' days'"></p>
                </div>
              </template>
              <p x-show="!j.app.applied_date" class="text-gray-600" x-text="j.kind === 'outreach' ? 'Not sent' : 'Not applied'"></p>
              <p x-show="!j.app.applied && j.deadline" class="text-amber-300 mt-1" x-text="'Deadline ' + fmtDay(j.deadline)"></p>
            </td>
            <td class="px-3 py-4 text-xs max-w-[15rem]">
              <template x-if="j.app.next">
                <button type="button" class="text-left hover:underline" :class="nextClass(j.app.next)"
                        @click.stop="j.app.next.kind === 'debrief' ? logStage(j, { event: j.app.events.find(e => e.id === j.app.next.event_id) }) : logStage(j)"
                        x-text="nextText(j.app.next)"></button>
              </template>
              <p x-show="j.app.next && j.app.next.kind === 'upcoming'" class="label-mono text-[11px] text-gray-500 mt-0.5" x-text="j.app.next && relDay(j.app.next.date)"></p>
              <span x-show="!j.app.next" class="text-gray-600">–</span>
            </td>
            <td class="px-3 py-4 label-mono text-xs whitespace-nowrap">
              <p x-show="j.app.last_activity" class="text-gray-300" x-text="fmtDay(j.app.last_activity)"></p>
              <p x-show="j.app.last_activity" class="text-gray-500" x-text="relDay(j.app.last_activity)"></p>
            </td>
            <td class="px-3 py-4 text-xs whitespace-nowrap">
              <a x-show="j.sent_cv" :href="'/jobs/' + j.job_id + '/sent/cv.pdf'" @click.stop class="flex items-center gap-1.5 text-gray-300 hover:text-accent">
                <svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 1h5l3 3v9H2z"/><path d="M7 1v3h3"/></svg>
                <span x-text="j.kind === 'outreach' ? (j.cv_name || 'CV') : (j.sent_cv_edited ? 'CV (edited)' : 'CV (library)')"></span>
              </a>
              <a x-show="j.sent_letter" :href="'/jobs/' + j.job_id + '/sent/letter.pdf'" @click.stop class="flex items-center gap-1.5 text-gray-300 hover:text-accent mt-1">
                <svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M1 3h10v8H1z"/><path d="m1 3 5 4 5-4"/></svg>
                Letter
              </a>
              <span x-show="j.app.applied && !j.sent_cv && !j.sent_letter" class="text-gray-600">not recorded</span>
              <span x-show="j.kind === 'outreach' && !j.app.applied" class="text-gray-500" x-text="j.cv_name ? 'will send: ' + j.cv_name : 'no Thesis CV yet'"></span>
            </td>
          </tr>
          <tr x-show="expanded === j.job_id" x-cloak class="bg-gray-950/40">
            <td></td>
            <td colspan="6" class="px-3 pb-5 pt-1">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2">
                  <p class="text-xs uppercase tracking-wide text-gray-500 mb-2">Timeline</p>
                  <ol class="border-l border-gray-800 ml-1 space-y-2">
                    <template x-for="e in [...j.app.events].reverse()" :key="e.id">
                      <li class="pl-3 relative flex items-start gap-3">
                        <span class="absolute -left-[4px] top-1.5 w-2 h-2 rounded-full" :class="e.upcoming ? 'bg-accent' : (e.group === 'outcome' ? (e.stage === 'accepted' ? 'bg-green-400' : 'bg-red-400') : 'bg-green-400')"></span>
                        <span class="label-mono text-[11px] text-gray-500 w-28 shrink-0 pt-0.5" x-text="(e.estimated ? '≈ ' : '') + fmtDay(e.date, true) + (e.time ? ' ' + e.time : '')"></span>
                        <span class="min-w-0">
                          <span class="text-gray-200" x-text="e.label"></span><span x-show="e.detail.kind" class="text-gray-500" x-text="' · ' + e.detail.kind"></span><span x-show="e.detail.rating" class="text-amber-300 ml-1" x-text="'★'.repeat(e.detail.rating || 0)"></span>
                          <span x-show="e.note" class="block text-xs text-gray-500 truncate" x-text="e.note"></span>
                        </span>
                        <button type="button" @click.stop="logStage(j, { event: e })" class="ml-auto text-xs text-gray-500 hover:text-gray-200">Edit</button>
                      </li>
                    </template>
                  </ol>
                  <p x-show="!j.app.events.length" class="text-sm text-gray-500">Nothing logged yet.</p>
                </div>
                <div class="text-sm space-y-2">
                  <p class="text-xs uppercase tracking-wide text-gray-500">Details</p>
                  <p x-show="j.channel"><span class="text-gray-500">Via</span> <span x-text="j.channel"></span></p>
                  <p x-show="j.contact"><span class="text-gray-500">Contact</span> <span x-text="j.contact"></span></p>
                  <p x-show="j.application_ref"><span class="text-gray-500">ID</span> <span class="label-mono text-xs" x-text="j.application_ref"></span></p>
                  <p x-show="j.notes" class="text-gray-400 text-xs whitespace-pre-line" x-text="j.notes"></p>
                  <div class="flex gap-3 pt-1">
                    <button type="button" @click.stop="logStage(j)" class="bg-accent-soft text-accent-ink font-medium rounded-md px-3 py-1 text-xs hover:bg-accent">Log stage</button>
                    <a :href="'/jobs/' + j.job_id + '#application'" class="text-xs text-accent hover:underline self-center" x-text="j.kind === 'outreach' ? 'Open lab page →' : 'Open job page →'"></a>
                  </div>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </template>
    </table>
  </div>
  <div class="flex flex-wrap items-center gap-x-5 gap-y-1 px-5 py-3 border-t border-gray-800 label-mono text-xs text-gray-500">
    <span x-text="visible.length + ' rows'"></span>
    <span x-show="section === 'labs'" class="text-accent" x-text="countWhere(j => j.status === 'new') + ' to contact'"></span>
    <span class="text-green-300" x-text="countWhere(j => j.app.applied && !j.app.closed) + ' open'"></span>
    <span class="text-accent" x-text="countWhere(j => j.app.next && j.app.next.kind === 'upcoming') + ' upcoming'"></span>
    <span class="text-amber-300" x-text="countWhere(j => j.app.next && j.app.next.kind === 'follow_up') + ' to follow up'"></span>
    <span class="text-red-300" x-text="countWhere(j => j.app.closed) + ' closed'"></span>
  </div>
</div>
